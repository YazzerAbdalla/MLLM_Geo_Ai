services:
  redis:
    image: redis:7-alpine
    container_name: mllm-geo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [fastapi]

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EARTH_ENGINE_PROJECT=${EARTH_ENGINE_PROJECT}
    depends_on: [redis]
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  celery-cpu-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q cpu -c 4 --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EARTH_ENGINE_PROJECT=${EARTH_ENGINE_PROJECT}
    depends_on: [redis]
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  celery-gpu-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q gpu -c 1 --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EARTH_ENGINE_PROJECT=${EARTH_ENGINE_PROJECT}
    depends_on: [redis]
    volumes:
      - ./data:/app/data
      - ./models:/app/models

volumes:
  redis_data: