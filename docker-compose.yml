services:

  redis:
    image: redis:7-alpine
    container_name: mllm-geo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:latest
    container_name: mllm-geo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      fastapi:
        condition: service_healthy

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mllm-geo-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EARTH_ENGINE_PROJECT=${EARTH_ENGINE_PROJECT}
      - DATABASE_URL=sqlite:////app/mllm_geo_ai.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mllm_goe_ai.db:/app/mllm_geo_ai.db
      - ${HOME}/.config/earthengine:/root/.config/earthengine:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  celery-cpu-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mllm-geo-celery-cpu
    restart: unless-stopped
    command: celery -A celery_app worker -Q cpu -c 4 --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EARTH_ENGINE_PROJECT=${EARTH_ENGINE_PROJECT}
      - DATABASE_URL=sqlite:////app/mllm_geo_ai.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mllm_goe_ai.db:/app/mllm_geo_ai.db
      - ${HOME}/.config/earthengine:/root/.config/earthengine:ro

  celery-gpu-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mllm-geo-celery-gpu
    restart: unless-stopped
    command: celery -A celery_app worker -Q gpu -c 1 --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EARTH_ENGINE_PROJECT=${EARTH_ENGINE_PROJECT}
      - DATABASE_URL=sqlite:////app/mllm_geo_ai.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mllm_goe_ai.db:/app/mllm_geo_ai.db
      - ${HOME}/.config/earthengine:/root/.config/earthengine:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis_data: